version: 2

models:
  - name: int_device_identity
    description: |
      3 階層の ID を名寄せした受信機の一覧。共通 ID が 1 行になる。
      1 つの IP アドレスに何台ぶら下がっているか、その受信機が何局に
      登場したかを持つ。パネル調査で属性が分かっている端末だけ
      GENDER_AGE_SEGMENT に値が入る。
    columns:
      - name: COMMON_ID
        description: 共通 ID
        tests:
          - not_null
          - unique
      - name: DEVICES_PER_IP
        description: 同じ IP アドレスを共有している受信機の数
        tests:
          - not_null

  - name: int_viewing_program
    description: 視聴区間と番組の放送枠を時刻の範囲で突き合わせた結果
    columns:
      - name: PROGRAM_ID
        tests:
          - not_null

  - name: int_cm_contact
    description: |
      放送されたコマーシャルへの接触。視聴区間にスポットの放送時刻が入って
      いたかどうかで判定した推定値であり、実測ではない。
    columns:
      - name: CM_ID
        tests:
          - not_null

  - name: int_viewing_minutes
    description: |
      視聴区間を 1 分単位に分解したもの。事実は変わらず粒度だけが上がる。
      行数はおよそ平均視聴区間長の倍数になる。
