version: 2

models:
  - name: mart_device_daily
    description: |
      1 行が「1 台 × 1 日 × 1 局」。リーチをあらかじめ計算せずにこの粒度で
      持つことで、日で見ても月で見ても局をまたいで見ても正しい人数が出せる。
      属性は 10 パーセントの端末にしか入っていない。
    columns:
      - name: VIEW_DATE
        tests:
          - not_null
      - name: COMMON_ID
        description: 共通 ID
        tests:
          - not_null
      - name: VIEW_MINUTES
        tests:
          - not_null

  - name: mart_program_viewing
    description: |
      1 行が「1 番組の放送回 × 1 台」。視聴台数や推計視聴人数は
      セマンティックビュー側で重複を除いて数える。
    columns:
      - name: PROGRAM_ID
        tests:
          - not_null
      - name: COMMON_ID
        tests:
          - not_null

  - name: mart_frequency
    description: |
      コマーシャルごと、受信機ごとの接触回数。1 行が 1 つのコマーシャルと
      1 台の受信機の組み合わせになっている。リーチ、フリークエンシー、
      インプレッションの 3 つをここから出す。
      放送の接触は実測でなく、視聴区間とスポット時刻の重なりによる推定値。
    columns:
      - name: CM_ID
        tests:
          - not_null
      - name: CONTACT_COUNT
        tests:
          - not_null

  - name: mart_zapping_transition
    description: |
      ある局の視聴終了から30分以内に次に見た別の局。局をまたいだ行動は
      1局のデータだけでは見えず、5局分を共通IDで束ねて初めて分かる。
    columns:
      - name: TRANSITION_COUNT
        tests:
          - not_null

  - name: mart_minute_audience
    description: |
      局ごと、1 分ごとの視聴台数。1 分単位に展開した int_viewing_minutes を
      「局 × 分」で数え、「誰が」を捨てて「何台」だけを残したもの。
      約 1,208 万行が約 55 万行に縮む。毎分の視聴カーブを描くための唯一のマート。
    columns:
      - name: NETWORK_ID
        tests:
          - not_null
          - accepted_values:
              values: ['NW01', 'NW02', 'NW03', 'NW04', 'NW05']
      - name: MINUTE_AT
        tests:
          - not_null
      - name: VIEWING_DEVICES
        tests:
          - not_null
